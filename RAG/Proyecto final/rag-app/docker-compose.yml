services:
  api:
    build: .
    container_name: rag-api
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      CHROMA_PATH: /app/chroma
      DATA_DIR: /app/data
      CHATS_DIR: /app/chats
    volumes:
      - chroma_data:/app/chroma
      - ./data:/app/data
      - ./chats:/app/chats
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  ui:
    build: .
    container_name: rag-ui
    command: >
      streamlit run ui/streamlit_app.py
      --server.port=8501
      --server.address=0.0.0.0
      --browser.gatherUsageStats=false
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      API_BASE_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  chroma_data:
